name: Daily Digest Push

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  run-digest:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 配置推送邮箱
        run: |
          mkdir -p ~/.ai-signal
          echo '{"delivery": {"method": "email", "email": "15064918@qq.com"}}' > ~/.ai-signal/config.json

      - name: 生成并发送简报
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          cd scripts
          
          # 修复邮件发件人限制
          sed -i 's/digest@resend.dev/onboarding@resend.dev/g' deliver.py
          
          # 抓取数据并轻量渲染出 Markdown 简报（不需要 LLM API）
          python prepare_digest.py | python render_digest.py > digest.md
          
          # 发送邮件
          python deliver.py --file digest.md
